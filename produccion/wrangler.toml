name = "aulalista"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Crea el espacio KV con:  npx wrangler kv namespace create KV   y pega aquí el id
[[kv_namespaces]]
binding = "KV"
id = "PEGA_AQUI_EL_ID_DEL_KV"

[vars]
MODEL = "claude-sonnet-5-5"
PUBLIC_URL = "https://aulalista.es"
# STRIPE_FOUNDER_LINK = "https://buy.stripe.com/..."   # Payment Link del plan Fundador
# MAILERLITE_GROUP_ID = "..."
# STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/..."   # Portal de cliente de Stripe (enlace de inicio de sesión).
#   La app ("Gestionar mi suscripción / cancelar") y el pie de la landing enlazan a /api/portal, que redirige aquí.
#   Debe ser https; sin configurar, /api/portal responde 503.
# Afiliados: no necesitan variables. ?ref=<código> → client_reference_id del Payment Link → KV aff:*.
#   Da de alta en el webhook de Stripe el evento invoice.paid (renovaciones) además de los de licencias.
#   Export: GET /api/admin/afiliados (Authorization: Bearer ADMIN_TOKEN) [?mes=AAAA-MM] [&codigo=x] [&formato=resumen]

# Secretos (NO van en este archivo). Créalos con:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put ADMIN_TOKEN             (mínimo 24 caracteres aleatorios)
#   npx wrangler secret put IP_SALT                 (cadena aleatoria larga: seudonimiza las IP del cupo gratuito)
#   npx wrangler secret put LICENSE_SECRET          (opcional, recomendado: deriva las licencias de forma idempotente)
#   npx wrangler secret put MAILERLITE_API_KEY      (opcional)

# Rate limiting nativo (recomendado). Limita generación, leads, /api/license y fallos de admin por IP o licencia.
# Comprueba la sintaxis vigente en la documentación de Cloudflare ("Rate Limiting" binding) antes de activarlo.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 10
#   period = 60
